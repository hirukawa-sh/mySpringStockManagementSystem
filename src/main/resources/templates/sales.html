<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/layout::head"></head>
<body data-page="sales">
  <header th:replace="~{common/layout::header('販売一覧')}"></header>
  
  <!--詳細モーダル-->
  <div class="modal fade" id="salesDetail" tabindex="-1" aria-labelledby="salesDetailLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="salesDetailLabel">売上詳細</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          
          <table class="table">
            <tbody>
              <tr>
                <th class="col-4">売上ID</th>
                <td id="detail_id"></td>
              </tr>
              <tr>
                <th>販売担当</th>
                <td id="detail_salesperson"></td>
              </tr>
              <tr>
                <th>販売日時</th>
                <td id="detail_salesdate"></td>
              </tr>
            </tbody>
          </table>

          <div id="grid_detail_items"></div>
          
          <table class="table">
            <tbody>
              <tr>
                <th class="text-end" colspan="2">小計</th>
                <td colspan="2" id="detail_subtotal"></td>
              </tr>
              <tr>
                <th class="text-end" colspan="2">税額</th>
                <td colspan="2" id="detail_tax"></td>
              </tr>
              <tr>
                <th class="text-end" colspan="2">合計</th>
                <td colspan="2" id="detail_total"></td>
              </tr>
            </tbody>
          </table>
          
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
        </div>
      </div>
    </div>
  </div>
  
  <a class="btn btn-primary m-3" th:href="@{/sales/new}">新規</a>
  
  <!--販売一覧-->
  <div id="grid_sales"></div>

        <th class="col-1" scope="col">ID</th>

      </tr>
    </thead>

      <tr th:each="sale : ${sales}">

        <td th:text="${sale.saleDate}"></td>
      </tr>
    </tbody>
  </table>
  
  <nav th:replace="common/layout::pagination"></nav>
  -->
  
</body>

</html>
