<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/layout::head"></head>
<body>
    
<header th:replace="common/layout::header('在庫一覧')"></header>

<div class="container mt-4">
    <h1>在庫一覧</h1>

    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>商品名</th>
                <th>在庫数</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="stock : ${stocks}">
                <td th:text="${stock.id}"></td>
                <td th:text="${stock.itemName}"></td>
                <td th:text="${stock.quantity}"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
