<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" />
    <title>販売管理システム</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>

<header th:fragment="header(title)">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <span class="navbar-brand" th:text="${title}"></span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/menu}"><i class="bi bi-house"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/items}"><i class="bi bi-upc-scan"></i> 商品管理</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/sales}"><i class="bi bi-cart3"></i> 販売管理</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/stock}"><i class="bi bi-box-seam"></i> 在庫管理</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main th:fragment="content">
 <!-- ここに各画面が入る -->
</main>

<footer>
 <hr>
 <p>© sample</p>
</footer>

</body>
</html>
