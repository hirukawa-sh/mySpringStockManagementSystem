<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>販売管理システム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-cart3"></i> 販売登録</a></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="menu.html"><i class="bi bi-house"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="items.html"><i class="bi bi-upc-scan"></i> 商品管理</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sales.html"><i class="bi bi-cart3"></i> 販売管理</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="stock.html"><i class="bi bi-box-seam"></i> 在庫管理</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  
  <form action="sales.html">
    <div class="mb-3">
      <label class="form-label">
        売上ID
      </label>
      <label for="form-label"></label>
    </div>
    <div class="mb-3">
      <label class="form-label">
        販売担当
      </label>
      <input type="text" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">
        販売日時
      </label>
      <input type="datetime-local" class="form-control">
    </div>
    
    <table class="table">
      <thead>
        <tr>
          <th scope="col" class="col-1">ID</th>
          <th scope="col">商品名</th>
          <th scope="col">販売単価</th>
          <th scope="col" class="col-2">数量</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row"></th>
          <td><input type="text" class="form-control"></td>
          <td><input type="text" class="form-control"></td>
          <td><input type="number" class="form-control"></td>
        </tr>
      </tbody>
    </table>
    <button class="btn btn-primary" type="submit">登録</button>
  </form>
  
</body>

</html>
