<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-64UC4BEhTGwk3eGpak4nO2jqtl7liTS+juXkSJ2gPAQPmlClQO7s5UgCeR6US48g" crossorigin="anonymous">
<link th:href="@{css/style.css}">
<body>

<h1>商品登録 / 編集</h1>

<form th:action="@{/item/save}" method="post">
<input type="hidden" name="id" th:value="${item.id}">

商品名:<input type="text" name="name" th:value="${item.name}"><br>
在庫数:<input type="number" name="quantity" th:value="${item.quantity}"><br>
<button class="btn btn-primary" type="submit">保存</button>

</form>

<a href="/item">戻る</a>

</body>
</html>
